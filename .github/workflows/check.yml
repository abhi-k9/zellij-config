name: check

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      network_smoke:
        description: Also check upstream latest-release metadata
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  PYTHONUTF8: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  regression:
    # Native parser and helper regressions; these do not drive a graphical terminal.
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install the selected, checksum-verified Zellij
        run: |
          python tools/manage.py install-zellij --bin-dir "$RUNNER_TEMP/zellij-bin"
          echo "$RUNNER_TEMP/zellij-bin" >> "$GITHUB_PATH"
      - name: Repository and real Zellij validation
        run: |
          zellij --version
          python tools/manage.py check
      - name: Direct-clone, fallback and deployment regressions
        run: python -m unittest discover -s tests -v

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
      - name: Locked Markdown tooling
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run lint:markdown
      - name: Shell validation
        run: shellcheck -s sh setup.sh check.sh hooks/pre-commit launcher/zj
      - name: Python lint and workflow validation
        run: |
          python -m pip install --only-binary=:all: --require-hashes -r requirements-dev.txt
          python -m ruff check tools tests
          python tools/lint_workflow.py
      - name: HTML validation
        run: |
          sudo apt-get update -q >/dev/null
          sudo apt-get install -y -q tidy >/dev/null
          for file in cheatsheets/*.html; do
            status=0
            tidy -q -e "$file" || status=$?
            test "$status" -le 1
          done

  network-smoke:
    # Opt-in live metadata/download checks; ordinary regressions use local fixtures.
    if: github.event_name == 'workflow_dispatch' && inputs.network_smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - run: |
          python tools/manage.py versions check
          PYTHONPATH=tools python - <<'PY'
          from pathlib import Path
          from zjconfig.common import load_versions
          from zjconfig.plugin_files import acquire
          root = Path('.')
          for pin in load_versions(root)['plugins']:
              _, origin = acquire(pin, root / 'plugins' / pin['asset'])
              if origin != 'download':
                  raise SystemExit(f'Live download failed for {pin["name"]}')
              print(f'{pin["name"]}: live HTTPS download verified')
          PY
